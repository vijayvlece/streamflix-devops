<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join | StreamFlix</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><header class="topbar"><a class="brand" href="/">STREAMFLIX</a><a href="/">Home</a></header><main class="auth-wrap"><form class="auth-card" method="post"><p class="eyebrow">START WATCHING</p><h1>Create account</h1>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}{% endwith %}<label>Username<input name="username" required minlength="3" autocomplete="username"></label><label>Password<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><button class="primary" type="submit">Create account</button><p>Already registered? <a href="/login">Login</a></p></form></main></body></html>
