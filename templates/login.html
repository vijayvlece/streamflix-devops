<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | StreamFlix</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><header class="topbar"><a class="brand" href="/">STREAMFLIX</a><a href="/">Home</a></header><main class="auth-wrap"><form class="auth-card" method="post"><p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}{% endwith %}<label>Username<input name="username" required minlength="3" autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary" type="submit">Login</button><p>New here? <a href="/register">Create an account</a></p></form></main></body></html>
